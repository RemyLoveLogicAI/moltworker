name: Secret Detection

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # TruffleHog Secret Scanning
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

  # Gitleaks Secret Scanning
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Custom Secret Pattern Detection
  custom-patterns:
    name: Custom Secret Patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          
          # Define patterns to search for
          patterns=(
            "api[_-]?key['\"]?\s*[:=]\s*['\"][a-zA-Z0-9_-]{20,}"
            "secret['\"]?\s*[:=]\s*['\"][a-zA-Z0-9_-]{20,}"
            "password['\"]?\s*[:=]\s*['\"][^\s]{8,}"
            "token['\"]?\s*[:=]\s*['\"][a-zA-Z0-9_-]{20,}"
            "sk-[a-zA-Z0-9]{20,}"
            "ghp_[a-zA-Z0-9]{36,}"
            "gho_[a-zA-Z0-9]{36,}"
            "github_pat_[a-zA-Z0-9]{22,}"
            "glpat-[a-zA-Z0-9_-]{20,}"
            "AKIA[0-9A-Z]{16}"
            "AIza[0-9A-Za-z_-]{35}"
          )
          
          found_secrets=0
          
          for pattern in "${patterns[@]}"; do
            echo "Checking pattern: $pattern"
            if grep -rP "$pattern" --include="*.ts" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.sh" --exclude-dir=node_modules --exclude-dir=.git .; then
              echo "❌ Found potential secret matching pattern: $pattern"
              found_secrets=$((found_secrets + 1))
            fi
          done
          
          if [ $found_secrets -gt 0 ]; then
            echo ""
            echo "❌ Found $found_secrets potential secret(s) in code!"
            echo "Please remove hardcoded secrets and use environment variables or GitHub Secrets instead."
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Check for dangerous logging patterns
        run: |
          echo "🔍 Scanning for dangerous logging patterns..."
          
          dangerous_logs=(
            "console\.log.*JSON\.stringify.*config"
            "console\.log.*process\.env"
            "console\.log.*\$\{.*API_KEY"
            "console\.log.*\$\{.*TOKEN"
            "console\.log.*\$\{.*PASSWORD"
            "console\.log.*\$\{.*SECRET"
          )
          
          found_dangerous=0
          
          for pattern in "${dangerous_logs[@]}"; do
            if grep -rP "$pattern" --include="*.ts" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git .; then
              echo "⚠️  Found potentially dangerous logging: $pattern"
              found_dangerous=$((found_dangerous + 1))
            fi
          done
          
          if [ $found_dangerous -gt 0 ]; then
            echo ""
            echo "⚠️  Found $found_dangerous potentially dangerous log statement(s)!"
            echo "Review these carefully to ensure no secrets are being logged."
            # Don't fail on this, just warn
          else
            echo "✅ No dangerous logging patterns detected"
          fi

      - name: Check for secrets in CLI arguments
        run: |
          echo "🔍 Scanning for secrets in CLI arguments..."
          
          if grep -rP '(--token|--password|--secret|--api-key)\s+["\$]' --include="*.sh" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ Found secrets passed as CLI arguments!"
            echo "This is insecure as they appear in process listings (ps aux)."
            echo "Use environment variables or config files instead."
            exit 1
          else
            echo "✅ No secrets in CLI arguments detected"
          fi

  # Report Status
  secret-scan-summary:
    name: Secret Scan Summary
    runs-on: ubuntu-latest
    needs: [trufflehog, gitleaks, custom-patterns]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🔒 Secret Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Custom Patterns | ${{ needs.custom-patterns.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.trufflehog.result }}" == "success" ]] && \
             [[ "${{ needs.gitleaks.result }}" == "success" ]] && \
             [[ "${{ needs.custom-patterns.result }}" == "success" ]]; then
            echo "✅ **All secret detection scans passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **One or more secret detection scans failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed checks and remove any hardcoded secrets." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any scan failed
        if: |
          needs.trufflehog.result != 'success' ||
          needs.gitleaks.result != 'success' ||
          needs.custom-patterns.result != 'success'
        run: |
          echo "❌ Secret detection failed! Please fix the issues above."
          exit 1
